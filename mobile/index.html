<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy. Only Kea's own scripts run (no inline script, no eval), so a hostile document, picture
      or question can't reach the native bridge. Styles may be inline (documents and drawings carry style attributes).
      Pictures: Kea's own files, inline data and blobs (EPUB pictures), and https (web pictures in documents, class
      pictures). Network: Kea's own files, GitHub's release API (updates), Wikipedia and Wiktionary (the Encyclopedia).
      The class site and the Kea Hub are reached from Java, never from here. (No frame-ancestors: browsers ignore it in
      a meta tag and log an error; nothing can frame the app's own web view anyway.)
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob: https://api.github.com https://*.wikipedia.org https://en.wiktionary.org; frame-src 'none'; child-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#131314" />
    <title>Kea</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
