<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="kea-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17191c"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <linearGradient id="kea-silver" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f6f7f8"/>
      <stop offset="0.5" stop-color="#c9ccd1"/>
      <stop offset="1" stop-color="#8b9199"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="63" height="63" rx="15" fill="url(#kea-bg)" stroke="#ffffff" stroke-opacity="0.08"/>
  <g fill="none" stroke="url(#kea-silver)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7">
    <!-- skull -->
    <path d="M30 15.6c-1.6-3-5.2-4.4-8.4-3.2-2 .8-3.4 2.4-4 4.4"/>
    <!-- long hooked upper beak (the kea's), and the short lower one -->
    <path d="M17.6 16.8c-3.6.2-6.4 2.8-6.8 6.6-.2 2.2.6 4.2 2 5.6"/>
    <path d="M17.6 16.8c1.4 1.6 1.8 3.8 1 5.8"/>
    <path d="M15.4 25.6c-.8.8-1.2 2-1.2 3.2"/>
    <circle cx="23.4" cy="16.2" r="1.25" stroke-width="1.3"/>
    <!-- neck vertebrae -->
    <path d="M29.6 18.2l.6 1.8M30.6 21.8l.8 1.8M31.9 25.3l1 1.7" stroke-width="1.9"/>
    <!-- spine, sweeping into the tail -->
    <path d="M34 28.6c5.2 2.4 9 6.6 11 12 1.4 3.8 2.6 8.6 6.2 14.4"/>
    <!-- ribs -->
    <path d="M35.6 30c-2 2.6-2.4 5.8-1.2 8.8M38.6 32c-1.8 2.8-2 6-.6 9M41.4 34.6c-1.4 2.8-1.4 5.8 0 8.4M43.6 37.8c-1 2.4-.8 4.8.4 7" stroke-width="1.3"/>
    <!-- folded wing: leading edge and three feather shafts -->
    <path d="M34.6 27.4c6.2-1.4 12.4.6 16.4 5.2"/>
    <path d="M40 28.4c4 3.2 7.6 7.4 10.4 12.6M44 29.6c2.8 3.8 5 8.2 6.4 13.2M47.6 31.2c1.6 3.6 2.6 7.6 2.8 11.8" stroke-width="1.3"/>
    <!-- leg and zygodactyl foot on a perch -->
    <path d="M40.6 44.8l-1.4 4.8 2.6 3.4M39.2 49.6l-2.8 2.8"/>
    <path d="M27.5 53.6h27" stroke="#7d838b" stroke-width="1.2"/>
  </g>
</svg>
