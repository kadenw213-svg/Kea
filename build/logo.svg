<svg xmlns="http://www.w3.org/2000/svg" viewBox="0.6 3.2 64 64">
  <defs>
    <linearGradient id="plume" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#acc777"/>
      <stop offset="0.55" stop-color="#7c984b"/>
      <stop offset="1" stop-color="#55702f"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#6b8740"/>
      <stop offset="1" stop-color="#3b5220"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e5e8ec"/>
      <stop offset="1" stop-color="#6c737b"/>
    </linearGradient>
    <linearGradient id="flash" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffbe74"/>
      <stop offset="1" stop-color="#e0601c"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- beak first; the head overlaps its base -->
  <path d="M24 18.5 C15.2 16.5 7.8 21 6.2 29 C5.5 33 6.4 37.4 8.4 40.8 C9.8 36.4 12.6 33.2 17.5 31.9 L24 31 Z" fill="url(#beak)"/>
  <path d="M16.6 32.7 C14.3 34.3 13.8 36.7 14.7 38.6 C17.7 38.1 20.8 36.2 22.5 34.2 Z" fill="#555c64"/>
  <!-- the orange underwing, showing below the folded wing -->
  <path d="M35 48.6 C43 46.8 52 47.8 59.8 51 C56.4 57.6 47.4 61.2 37.6 60.6 Z" fill="url(#flash)"/>
  <!-- head and body -->
  <path d="M19 27 C18.6 17.6 26.8 10 36.2 10.4 C45.2 10.8 50.2 18.2 50.6 26.8 C50.9 33.6 52.4 40 54.6 46.4 C48 50.6 40 53.4 33.4 57.6 C30 58.6 28 58.4 26.2 57.2 C25.4 48.6 23.2 40.8 19 33.4 Z" fill="url(#plume)"/>
  <path d="M21.5 22 C24 14.6 30 11.4 36.2 11.6 C42 11.8 46 14.8 48 19.2 C43 16 36 15 30 17 C26 18.4 23.4 20.4 21.5 22 Z" fill="url(#shine)"/>
  <!-- the folded wing with its feather tips -->
  <path d="M38.5 29 C46 29.5 51.5 36 54 43 C55.6 47.4 56.6 50 57.4 52.4 L52.6 51.2 L51.2 54.6 L47.4 52.6 L45.4 56 L42 53 L39.4 56.4 C37.2 47.4 36.4 37.4 38.5 29 Z" fill="url(#wing)"/>
  <path d="M41 33 C44 38 45.6 44.6 46.2 50.6 M44.6 32.6 C48.4 37.2 50.6 42.6 51.6 48.6" fill="none" stroke="#a9c27a" stroke-opacity="0.35" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="29.2" cy="20.6" r="2.7" fill="#14171a"/>
  <circle cx="30" cy="19.8" r="0.85" fill="#fff" fill-opacity="0.9"/>
</svg>
